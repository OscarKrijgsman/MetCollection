services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: metcollection
      POSTGRES_USER: metcollection
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metcollection}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metcollection -d metcollection"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://metcollection:${POSTGRES_PASSWORD:-metcollection}@db:5432/metcollection
      TZ: Europe/Amsterdam
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["serve"]

volumes:
  pgdata:
